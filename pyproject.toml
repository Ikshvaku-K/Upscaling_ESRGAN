[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upscaler"
version = "0.1.0"
description = "AI Image and Video Upscaling Tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "opencv-python",
    "numpy",
    "tqdm",
    "PyYAML",
    "basicsr",
    "realesrgan",
    "psutil",
]

[project.optional-dependencies]
# TensorRT acceleration (convert-trt subcommand, trt_run)
trt = ["tensorrt"]
# Model download + comparison scripts at the repo root
scripts = ["requests>=2.32.4", "scikit-image", "beautifultable"]

[project.scripts]
upscaler = "upscaler.cli:main"

[tool.setuptools.package-data]
upscaler = ["config.yaml"]
